name: macOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_release:
        description: Build and verify the complete v0.1.0 release assets
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: macos-15
    steps:
      - name: Check out pinned sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Initialize core submodules
        run: |-
          git submodule sync -- \
            third_party/hermes \
            third_party/react-native \
            third_party/fast_float
          git submodule update --init --depth 1 -- \
            third_party/hermes \
            third_party/react-native \
            third_party/fast_float
      - name: Install native dependencies
        run: brew install cmake ninja boost double-conversion fmt folly glog
      - name: Build and test core release
        run: |-
          test "$(uname -m)" = arm64
          cmake -S . -B build/ci-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DRNS_ENABLE_SKIA=OFF \
            -DRNS_ENABLE_IMGUI=OFF \
            -DRNS_ENABLE_SOURCE_DEVTOOLS_FRONTEND=OFF
          cmake --build build/ci-release --parallel 3
          ctest --test-dir build/ci-release --output-on-failure
      - name: Build and test instrumented core without suppressions
        run: |-
          cmake -S . -B build/ci-sanitized -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DRNS_ENABLE_SANITIZERS=ON \
            -DRNS_ENABLE_SKIA=OFF \
            -DRNS_ENABLE_IMGUI=OFF \
            -DRNS_ENABLE_SOURCE_DEVTOOLS_FRONTEND=OFF
          cmake --build build/ci-sanitized --parallel 3
          ASAN_OPTIONS=halt_on_error=1:detect_container_overflow=1 \
            UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            ctest --test-dir build/ci-sanitized --output-on-failure
      - name: Verify clean install consumer
        run: ctest --test-dir build/ci-release --output-on-failure -R '^package-'

  full-release:
    if: github.event_name == 'workflow_dispatch' && inputs.full_release
    # A complete RN + Skia checkout exceeds the 14 GB disk on standard hosted
    # macOS runners. This label identifies an Apple Silicon release machine.
    runs-on: [self-hosted, macOS, ARM64, rnsim-release]
    timeout-minutes: 180
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          submodules: recursive
          lfs: true
          persist-credentials: false
      - name: Verify clean source and runner
        run: |-
          test "$(uname -m)" = arm64
          test -z "$(git status --porcelain)"
          ! git submodule status --recursive | grep -Eq '^[+-U]'
          git lfs fsck
      - name: Install build dependencies
        run: brew install cmake ninja boost double-conversion fmt folly glog
      - name: Bootstrap pinned Skia
        run: cmake/bootstrap-skia-macos.sh
      - name: Build RN Tester caller bundle
        run: |-
          cmake --preset release
          cmake --build --preset release --parallel 8
          node tools/rntester/bundle.mjs \
            --install \
            --dev false \
            --out-dir build/release-rntester \
            --build-dir build/release
      - name: Verify complete release build
        run: |-
          cmake --preset release \
            -DRNS_RNTESTER_BUNDLE="$PWD/build/release-rntester/RNTesterApp.android.jsbundle" \
            -DRNS_REQUIRE_RNTESTER_BUNDLE=ON
          cmake --build --preset release --parallel 8
          ctest --preset release
          node tools/diagnostics/verify-runtime.mjs
          node tools/diagnostics/verify-addons.mjs
      - name: Verify full sanitizer lane without suppressions
        run: |-
          cmake --preset sanitized \
            -DRNS_RNTESTER_BUNDLE="$PWD/build/release-rntester/RNTesterApp.android.jsbundle" \
            -DRNS_REQUIRE_RNTESTER_BUNDLE=ON
          cmake --build --preset sanitized --parallel 8
          ctest --preset sanitized
      - name: Package and verify final assets
        run: |-
          tools/release/package-macos.sh build/release dist
          tools/release/package-rntester-demo.sh \
            build/release build/release-rntester dist
          tools/release/verify-release.sh dist
      - name: Verify reproducible archives
        run: |-
          second_output=$(mktemp -d "$RUNNER_TEMP/rnsim-repro.XXXXXX")
          tools/release/package-macos.sh build/release "$second_output"
          tools/release/package-rntester-demo.sh \
            build/release build/release-rntester "$second_output"
          cmp dist/rnsim-v0.1.0-macos-arm64.tar.gz \
            "$second_output/rnsim-v0.1.0-macos-arm64.tar.gz"
          cmp dist/rnsim-rntester-demo-v0.1.0-macos-arm64.tar.gz \
            "$second_output/rnsim-rntester-demo-v0.1.0-macos-arm64.tar.gz"
      - name: Upload verified release candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: react-native-simulator-v0.1.0-macos-arm64
          path: |-
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
