name: macOS

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: macos-15
    steps:
      - name: Check out pinned sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Initialize core submodules
        run: |-
          git submodule sync -- \
            third_party/hermes \
            third_party/react-native \
            third_party/fast_float \
            third_party/glog
          git submodule update --init --depth 1 -- \
            third_party/hermes \
            third_party/react-native \
            third_party/fast_float \
            third_party/glog
          hermes_tag=$(sed -n \
            's/^set(RNS_EXPECTED_HERMES_TAG "\([^"]*\)").*/\1/p' \
            cmake/DependencyVersions.cmake)
          test -n "$hermes_tag"
          git -C third_party/hermes fetch --depth 1 origin tag "$hermes_tag"
          fast_float_tag=$(sed -n \
            's/^set(RNS_EXPECTED_FAST_FLOAT_TAG "\([^"]*\)").*/\1/p' \
            cmake/DependencyVersions.cmake)
          test -n "$fast_float_tag"
          git -C third_party/fast_float fetch --depth 1 origin tag "$fast_float_tag"
          glog_commit=$(sed -n \
            's/^set(RNS_EXPECTED_GLOG_COMMIT "\([^"]*\)").*/\1/p' \
            cmake/DependencyVersions.cmake)
          test -n "$glog_commit"
          git -C third_party/glog fetch --depth 1 origin "$glog_commit"
          git -C third_party/glog checkout --detach "$glog_commit"
      - name: Install native dependencies
        run: brew install cmake ninja boost double-conversion fmt folly
      - name: Build and test core release
        run: |-
          test "$(uname -m)" = arm64
          cmake -S . -B build/ci-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DRNS_ENABLE_SKIA=OFF \
            -DRNS_ENABLE_IMGUI=OFF \
            -DRNS_ENABLE_SOURCE_DEVTOOLS_FRONTEND=OFF
          cmake --build build/ci-release --parallel 3
          ctest --test-dir build/ci-release --output-on-failure
      - name: Build and test instrumented core without suppressions
        run: |-
          cmake -S . -B build/ci-sanitized -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DRNS_ENABLE_SANITIZERS=ON \
            -DRNS_ENABLE_SKIA=OFF \
            -DRNS_ENABLE_IMGUI=OFF \
            -DRNS_ENABLE_SOURCE_DEVTOOLS_FRONTEND=OFF
          cmake --build build/ci-sanitized --parallel 3
          ASAN_OPTIONS=halt_on_error=1:detect_container_overflow=1 \
            UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            ctest --test-dir build/ci-sanitized --output-on-failure
