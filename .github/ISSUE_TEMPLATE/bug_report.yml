name: Bug report
description: Report a reproducible runtime, renderer, or frontend defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not disclose security vulnerabilities here. Follow SECURITY.md and
        contact the repository owner privately.
  - type: input
    id: simulator_version
    attributes:
      label: Simulator version
      description: Paste the first line of `rnsim --version`.
    validations:
      required: true
  - type: input
    id: rn_version
    attributes:
      label: React Native version
      placeholder: 0.87.0
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Paste `rnsim doctor --json` after removing sensitive paths.
      render: shell
    validations:
      required: true
  - type: textarea
    id: bundle
    attributes:
      label: Bundle source
      description: Include entry point, platform, dev/minify mode, and how the bundle was built.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration or launcher
      description: Paste rnsim.json with secrets removed, or state the release launcher and version if no config was exposed.
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include exact commands, expected behavior, and actual output.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshot, metrics, or trace
      description: Attach the evidence relevant to the defect. Screenshots are required for visual issues.
