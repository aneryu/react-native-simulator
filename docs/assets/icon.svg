      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hostGlow" cx="50%" cy="46%" r="46%">
      <stop offset="0%" stop-color="#5E6AD2" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#5E6AD2" stop-opacity="0"/>
